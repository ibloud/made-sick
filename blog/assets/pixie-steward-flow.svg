<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">PIXIE Device Stewardship prototype flow</title>
<desc id="desc">A faithful diagram of the proposed consent-first PIXIE action flow: intent, proposed action, consequence preview, explicit consent, execution, and rollback receipt.</desc>
<rect width="1600" height="700" fill="#0d0c12"/>
<text x="70" y="75" font-family="Courier New, monospace" font-size="20" fill="#e7c96f" letter-spacing="3">PIXIE DEVICE STEWARDSHIP // PROPOSED INTERACTION CONTRACT</text>
<text x="70" y="125" font-family="Georgia, serif" font-size="48" fill="#f4edf4">Show the consequence before the magic.</text>
<text x="70" y="165" font-family="Arial, sans-serif" font-size="18" fill="#aaa0aa">Prototype specification — not a screenshot of a shipped OS.</text>
<g font-family="Courier New, monospace">
<g stroke="#9bd7d4" stroke-width="2" fill="#15131b">
<rect x="70" y="250" width="190" height="160"/><rect x="300" y="250" width="190" height="160"/><rect x="530" y="250" width="190" height="160"/><rect x="760" y="250" width="190" height="160"/><rect x="990" y="250" width="190" height="160"/><rect x="1220" y="250" width="260" height="160"/>
</g>
<g fill="#f4edf4" font-size="16">
<text x="95" y="285">01 / INTENT</text><text x="95" y="325">What do you</text><text x="95" y="350">want to happen?</text>
<text x="325" y="285">02 / PROPOSE</text><text x="325" y="325">Here is the</text><text x="325" y="350">specific action.</text>
<text x="555" y="285">03 / PREVIEW</text><text x="555" y="325">Here is what</text><text x="555" y="350">will change.</text>
<text x="785" y="285">04 / CONSENT</text><text x="785" y="325">Yes / No.</text><text x="785" y="350">No silent execution.</text>
<text x="1015" y="285">05 / EXECUTE</text><text x="1015" y="325">Apply only the</text><text x="1015" y="350">approved change.</text>
<text x="1245" y="285">06 / RECEIPT + ROLLBACK</text><text x="1245" y="325">Record what happened.</text><text x="1245" y="350">Make reversal explicit.</text>
</g>
<g stroke="#e7c96f" stroke-width="3" fill="none">
<path d="M260 330h40M490 330h40M720 330h40M950 330h40M1180 330h40"/>
<path d="M292 320l10 10-10 10M522 320l10 10-10 10M752 320l10 10-10 10M982 320l10 10-10 10M1212 320l10 10-10 10"/>
</g>
<text x="70" y="510" font-family="Arial, sans-serif" font-size="20" fill="#f4edf4">Boundary conditions</text>
<text x="70" y="550" font-family="Courier New, monospace" font-size="16" fill="#aaa0aa">NO SILENT INFERENCE   ·   NO SECRET MONITORING   ·   NO UNAUTHORIZED FILE CHANGES</text>
<text x="70" y="585" font-family="Courier New, monospace" font-size="16" fill="#aaa0aa">NO AUTOMATIC PUBLICATION   ·   PRIVATE PROVENANCE STAYS PRIVATE   ·   STOP IS ALWAYS VALID</text>
<text x="70" y="650" font-family="Courier New, monospace" font-size="14" fill="#77707a">STATUS: PROPOSED / SPECIFICATION ARTIFACT</text>
</g>
</svg>
